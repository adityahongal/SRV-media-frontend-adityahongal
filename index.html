<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Premier Schools Exhibition — Discover Gurugram's Top Schools</title>
    <meta
      name="description"
      content="Premier Schools Exhibition — Discover Gurugram's top 30+ schools, all in one place."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&family=Open+Sans:wght@400;600;700&display=swap"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/header.css" />
  </head>
  <body>
    <!-- Skip link: FIRST focusable element on the page -->
    <a href="#main" class="skip-link">Skip to main content</a>
  
    <!-- Sticky header — fixed at top, hidden until scroll -->
    <header class="sticky-header" data-state="hidden" aria-label="Site header">
      <div class="sticky-header__logo-container">
        <img class="sticky-header__logo" src="assets/img/logo.png" alt="" />
      </div>
  
      <a href="#register" class="sticky-header__register-button" aria-label="Register Now">
        <span class="sticky-header__button-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
               stroke-width="1.8" stroke="currentColor"
               class="sticky-header__icon-arrow">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25" />
          </svg>
        </span>
        <span class="sticky-header__button-text">Register Now</span>
      </a>
    </header>
  
    <main id="main">
      <section class="hero" aria-label="Welcome">
  
        <!-- Hero header — lives inside the hero, scrolls away with it -->
        <header class="hero-header" aria-label="Hero header">
          <div class="hero-header__logo-container">
            <img class="hero-header__logo" src="assets/img/logo.png" alt="" />
          </div>
  
          <a href="#register" class="hero-header__register-button" aria-label="Register Now">
            <span class="hero-header__button-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                   stroke-width="1.8" stroke="currentColor"
                   class="hero-header__icon-arrow">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25" />
              </svg>
            </span>
            <span class="hero-header__button-text">Register Now</span>
          </a>
        </header>

        <!-- TEMPORARY: gives the hero height so the page is scrollable -->
    <div style="height: 100vh; background: #f3eaff;"></div>
  
        <!-- Headline, dual-axis slider, registration form go here later -->
      </section>

      <section class="schools-marquee" aria-label="Participating schools">
        <!-- Two-row continuous logo marquee -->
      </section>

      <section
        class="exhibition-banner"
        aria-label="About Premier Schools Exhibition"
      >
        <!-- Dark banner with PSE logo and dates -->
      </section>

      <section
        id="schools"
        class="choose-school"
        aria-labelledby="choose-school-title"
      >
        <h2 id="choose-school-title">Choose the School That Fits You Best</h2>
        <!-- 4 cards on desktop, slider on mobile -->
      </section>

      <section class="appointments" aria-labelledby="appointments-title">
        <h2 id="appointments-title">Pre-schedule Your School Appointments</h2>
        <!-- CTA + illustration -->
      </section>

      <section class="attractions" aria-labelledby="attractions-title">
        <h2 id="attractions-title">Other Attractions for Parents &amp; Kids</h2>
        <!-- Highlight cards -->
      </section>

      <section
        id="exhibition"
        class="exhibition"
        aria-labelledby="exhibition-title"
      >
        <h2 id="exhibition-title">What Makes This Exhibition a Must-Visit</h2>
        <!-- Section slider with 3–6 highlight cards -->
      </section>

      <section class="parents" aria-labelledby="parents-title">
        <h2 id="parents-title">What Makes Parents Choose Us</h2>
        <!-- Testimonial / value cards -->
      </section>

      <section id="gallery" class="gallery" aria-labelledby="gallery-title">
        <h2 id="gallery-title">Gallery</h2>
        <!-- Photo grid -->
      </section>
    </main>

    <footer class="site-footer">
      <!-- Contact, social, copyright -->
    </footer>

    <script src="js/main.js" defer></script>
    <script src="js/header.js" defer></script>
  </body>
</html>
