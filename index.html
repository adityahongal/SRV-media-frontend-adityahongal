<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Premier Schools Exhibition — Discover Gurugram's Top Schools</title>
  <meta name="description" content="Premier Schools Exhibition — Discover Gurugram's top 30+ schools, all in one place." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="css/base.css" />
</head>
<body>

  <header class="site-header">
    <!-- Logo + nav will go here -->
  </header>

  <main id="main">

    <section class="hero" aria-label="Welcome">
      <!-- Headline, dual-axis slider, registration form -->
    </section>

    <section class="schools-marquee" aria-label="Participating schools">
      <!-- Two-row continuous logo marquee -->
    </section>

    <section class="exhibition-banner" aria-label="About Premier Schools Exhibition">
      <!-- Dark banner with PSE logo and dates -->
    </section>

    <section id="schools" class="choose-school" aria-labelledby="choose-school-title">
      <h2 id="choose-school-title">Choose the School That Fits You Best</h2>
      <!-- 4 cards on desktop, slider on mobile -->
    </section>

    <section class="appointments" aria-labelledby="appointments-title">
      <h2 id="appointments-title">Pre-schedule Your School Appointments</h2>
      <!-- CTA + illustration -->
    </section>

    <section class="attractions" aria-labelledby="attractions-title">
      <h2 id="attractions-title">Other Attractions for Parents &amp; Kids</h2>
      <!-- Highlight cards -->
    </section>

    <section id="exhibition" class="exhibition" aria-labelledby="exhibition-title">
      <h2 id="exhibition-title">What Makes This Exhibition a Must-Visit</h2>
      <!-- Section slider with 3–6 highlight cards -->
    </section>

    <section class="parents" aria-labelledby="parents-title">
      <h2 id="parents-title">What Makes Parents Choose Us</h2>
      <!-- Testimonial / value cards -->
    </section>

    <section id="gallery" class="gallery" aria-labelledby="gallery-title">
      <h2 id="gallery-title">Gallery</h2>
      <!-- Photo grid -->
    </section>

  </main>

  <footer class="site-footer">
    <!-- Contact, social, copyright -->
  </footer>

  <script src="js/main.js" defer></script>
</body>
</html>
